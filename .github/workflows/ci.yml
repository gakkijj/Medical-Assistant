name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline-regression:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: medix-agent-swarm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile source
        run: python -m compileall -q .
      - name: Install CI dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Run unit and API tests
        run: python -m pytest tests -q
      - name: Lint maintained modules
        run: ruff check api core knowledge/hybrid_retriever.py evaluation tests
      - name: Run routing benchmark gates
        run: python evaluation/run_benchmark.py --check
