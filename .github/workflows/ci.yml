name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline-regression:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: medix-agent-swarm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile source
        run: python -m compileall -q .
      - name: Run dependency-free unit tests
        run: python -m unittest discover -s tests -p 'test_offline_*.py' -v
      - name: Run routing benchmark gates
        run: python evaluation/run_benchmark.py --check
